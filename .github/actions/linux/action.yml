name: "Build Android"
inputs:
  os:
    required: true
  arch:
    required: true
  version:
    description: release version
    required: true
outputs:
  outdir:
    description: release directory
    value: ${{ steps.out.outputs.outdir }}
runs:
  using: "composite"
  steps:
    - name: Install packages
      shell: bash
      run: |
        sudo apt-get update
        dart pub global activate fastforge
        sudo apt-get install -y flatpak flatpak-builder appstream appstream-compose
        mkdir out
        echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH
    - name: Install Flatpak runtime and SDK
      shell: bash
      run: |
        sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
        sudo flatpak install -y flathub org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08
      env:
        ARCH: ${{ inputs.arch }}
    # Built in an old distro, because the build system's glibc, libstdc++ and GLib
    # headers set the minimum for every user. The check below enforces the limits.
    - name: Build
      shell: bash
      run: ./misc/build-linux-in-container.sh
    - name: Check glibc and libstdc++ requirements
      shell: bash
      run: ./misc/check-bundle-abi.sh build/linux/*/release/bundle
    - name: Launch on older and newer distros
      shell: bash
      run: |
        for image in debian:12 ubuntu:22.04 ubuntu:26.04; do
          ./misc/smoke-linux-bundle.sh build/linux/*/release/bundle dist/*/*.AppImage "$image"
        done
    - name: Build Flatpak
      if: ${{ inputs.arch == 'x86_64' && github.event_name != 'pull_request' }}
      shell: bash
      run: |
        flatpak-builder --force-clean flatpak-build flatpak/cc.methyl.Zkool.yml
        flatpak build-export export flatpak-build
        flatpak build-bundle export out/zkool-${{ inputs.version }}-${{ inputs.arch }}.flatpak cc.methyl.Zkool
      env:
        ARCH: ${{ inputs.arch }}
    - name: Make ISO
      if: ${{ inputs.arch == 'x86_64' && github.event_name != 'pull_request' }}
      id: iso
      shell: bash
      run: |
        cp -r build/linux/x64/release/bundle misc/
        cd misc
        docker build -t iso_builder -f iso.dockerfile .
        docker run --rm --privileged -v ".":/iso/out iso_builder bash -c "mkarchiso -w w -o out p"
    - name: Move to outdir
      id: out
      shell: bash
      run: |
        find . -path ./out -prune -o -type f \( -name "*.deb" -o -name "*.AppImage" -o -name "*.iso" -o -name "*.flatpak" \) -exec sh -c '
          f="$1"
          base=$(basename "$f")
          ext="${base##*.}"
          mv "$f" "out/${NAME}-${ARCH}.${ext}"
        ' sh {} \;
        ls -l out
        echo "outdir=out" >> $GITHUB_OUTPUT
      env:
        NAME: zkool-${{ inputs.version }}
        ARCH: ${{ inputs.arch }}
