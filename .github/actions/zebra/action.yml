name: "Setup Zebra regtest"
description: Use a pinned bootstrap wallet to start and fund an independent Ironwood regtest.
inputs:
  MINER_SEED:
    required: true
  MINER_ADDRESS:
    required: true
  SEED:
    required: true
  DESTINATION_ADDRESS:
    required: true
  BLOCKS:
    required: false
    default: "300"
runs:
  using: "composite"
  steps:
    - name: Install Zebra and lightwalletd
      uses: ./.github/actions/install-regtest-tools

    - name: Start regtest, mine and shield to wallet
      shell: bash
      run: |
        set -euo pipefail
        rm -rf "$HOME/.cache/zebra" "$GITHUB_WORKSPACE/data"
        rm -f "$GITHUB_WORKSPACE/regtest.db"
        ./example/sh/mine.sh
      env:
        BLOCKS: ${{ inputs.BLOCKS }}
        MINER_SEED: ${{ inputs.MINER_SEED }}
        MINER_ADDRESS: ${{ inputs.MINER_ADDRESS }}
        SEED: ${{ inputs.SEED }}
        DESTINATION_ADDRESS: ${{ inputs.DESTINATION_ADDRESS }}
