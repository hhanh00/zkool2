name: Build ZKool GraphQL
description: Build the GraphQL wallet server from the checked-out revision.

inputs:
  profile:
    description: Cargo profile (release or debug)
    required: false
    default: release
  ledger-transport:
    description: Ledger transport to compile (ledger for HID or zemu for HTTP)
    required: false
    default: ledger

runs:
  using: composite
  steps:
    - name: Install native dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libudev-dev pkg-config

    - name: Build zkool_graphql
      shell: bash
      env:
        BUILD_PROFILE: ${{ inputs.profile }}
        LEDGER_TRANSPORT: ${{ inputs.ledger-transport }}
      run: |
        set -euo pipefail
        if [[ "$LEDGER_TRANSPORT" != "ledger" && "$LEDGER_TRANSPORT" != "zemu" ]]; then
          echo "ledger-transport must be ledger or zemu" >&2
          exit 2
        fi
        args=(build --bin zkool_graphql --no-default-features --features="graphql,bundled-sapling-params,$LEDGER_TRANSPORT")
        if [[ "$BUILD_PROFILE" == "release" ]]; then
          args+=(--release)
        elif [[ "$BUILD_PROFILE" != "debug" ]]; then
          echo "profile must be release or debug" >&2
          exit 2
        fi
        cargo "${args[@]}" --manifest-path rust/Cargo.toml
        echo "$GITHUB_WORKSPACE/target/$BUILD_PROFILE" >> "$GITHUB_PATH"
