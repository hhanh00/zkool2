name: Build ZKool GraphQL (reusable)

on:
  workflow_call:
    secrets:
      NEAR_INTENTS_API_KEY:
        required: false
    inputs:
      ledger-transport:
        description: Ledger transport to compile (ledger for HID or zemu for HTTP)
        required: false
        default: ledger
        type: string

jobs:
  build:
    env:
      NEAR_INTENTS_API_KEY: ${{ secrets.NEAR_INTENTS_API_KEY }}
    # The concurrency group lives on the caller's job: `inputs` does not
    # resolve in a reusable workflow's concurrency key, which put every
    # transport into one queue.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable

      - name: Restore zkool_graphql cache
        id: cache
        uses: actions/cache/restore@v5
        with:
          path: target/release/zkool_graphql
          key: ${{ runner.os }}-zkool-graphql-${{ inputs.ledger-transport }}-${{ hashFiles('Cargo.lock', 'rust/Cargo.toml', 'rust/src/**', 'lib/**/*.dart', 'pubspec.yaml', 'pubspec.lock') }}

      # The dependency artifacts, so a source change rebuilds the crate and
      # not its 800 dependencies. Keyed on Cargo.lock and rust-toolchain.toml
      # only: the environment hash covers every installed rustc, and the
      # runner's stable, which the build never uses, moved the key at each
      # Rust release. Saved from main only (Ledger Tests builds zemu there on
      # every push): a pull request reads main's entry, and per-PR copies of
      # 1.2 GB pushed main's out of the 10 GB store. One entry for both
      # transports: the ledger build (release workflow, never on main)
      # restores it and compiles the few crates that differ. The cache holds
      # dependencies only, never the crate's own artifacts. Saved on a failed
      # build too, so a compile error does not throw the dependencies away.
      - name: Cache the compiled dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: zkool-graphql
          add-rust-environment-hash-key: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Build zkool_graphql
        if: steps.cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/build-graphql
        with:
          ledger-transport: ${{ inputs.ledger-transport }}

      - name: Save zkool_graphql cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: target/release/zkool_graphql
          key: ${{ steps.cache.outputs.cache-primary-key }}
