name: Build ZKool GraphQL (reusable)

on:
  workflow_call:
    secrets:
      NEAR_INTENTS_API_KEY:
        required: false
    inputs:
      ledger-transport:
        description: Ledger transport to compile (ledger for HID or zemu for HTTP)
        required: false
        default: ledger
        type: string
      cache-dependencies:
        description: >-
          Keep the compiled dependencies between runs, so a source change
          rebuilds the crate and not its 800 dependencies. The test workflows
          set it; the release build starts from a clean target.
        required: false
        default: false
        type: boolean

jobs:
  build:
    env:
      NEAR_INTENTS_API_KEY: ${{ secrets.NEAR_INTENTS_API_KEY }}
    # The concurrency group lives on the caller's job: `inputs` does not
    # resolve in a reusable workflow's concurrency key, which put every
    # transport into one queue.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable

      - name: Restore zkool_graphql cache
        id: cache
        uses: actions/cache/restore@v5
        with:
          path: target/release/zkool_graphql
          key: ${{ runner.os }}-zkool-graphql-${{ inputs.ledger-transport }}-${{ hashFiles('Cargo.lock', 'rust/Cargo.toml', 'rust/src/**', 'lib/**/*.dart', 'pubspec.yaml', 'pubspec.lock') }}

      # The dependency artifacts, keyed on Cargo.lock and the toolchain, one
      # entry per transport (the two differ by a crate). Saved on a failed
      # build too, so a compile error does not throw the dependencies away.
      - name: Cache the compiled dependencies
        if: inputs.cache-dependencies && steps.cache.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: zkool-graphql-${{ inputs.ledger-transport }}
          cache-on-failure: true

      - name: Build zkool_graphql
        if: steps.cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/build-graphql
        with:
          ledger-transport: ${{ inputs.ledger-transport }}

      - name: Save zkool_graphql cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: target/release/zkool_graphql
          key: ${{ steps.cache.outputs.cache-primary-key }}
