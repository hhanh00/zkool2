name: Build ZKool GraphQL (reusable)

on:
  workflow_call:
    secrets:
      NEAR_INTENTS_API_KEY:
        required: false
    inputs:
      ledger-transport:
        description: Ledger transport to compile (ledger for HID or zemu for HTTP)
        required: false
        default: ledger
        type: string

jobs:
  build:
    env:
      NEAR_INTENTS_API_KEY: ${{ secrets.NEAR_INTENTS_API_KEY }}
    # Release the slot as soon as the binary is cached, before caller tests run.
    concurrency:
      group: zkool-graphql-${{ inputs.ledger-transport }}-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: false
      # Keep all callers waiting; the default queue replaces pending runs.
      queue: max
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable

      - name: Restore zkool_graphql cache
        id: cache
        uses: actions/cache/restore@v5
        with:
          path: target/release/zkool_graphql
          key: ${{ runner.os }}-zkool-graphql-${{ inputs.ledger-transport }}-${{ hashFiles('Cargo.lock', 'rust/Cargo.toml', 'rust/src/**', 'lib/**/*.dart', 'pubspec.yaml', 'pubspec.lock') }}

      - name: Build zkool_graphql
        if: steps.cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/build-graphql
        with:
          ledger-transport: ${{ inputs.ledger-transport }}

      - name: Save zkool_graphql cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: target/release/zkool_graphql
          key: ${{ steps.cache.outputs.cache-primary-key }}
