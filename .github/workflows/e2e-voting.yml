name: Voting E2E Infrastructure

on:
  workflow_dispatch:

concurrency:
  group: voting-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ironwood-wallet:
    name: Zebra → lightwalletd → ZKool V3 note
    if: ${{ !startsWith(github.head_ref, 'release-please--branches--') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SVOTED_VERSION: v1.6.1-rc.6
      NF_SERVER_VERSION: v0.12.2
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Start fresh regtest and fund an Ironwood note
        uses: ./.github/actions/zebra
        with:
          MINER_SEED: "burger voice warrior danger satoshi you solid atom elite alcohol category layer able debate culture talk tissue language hip surge fiction paddle stove voyage"
          MINER_ADDRESS: "tmQ1BiNRfsvT6eMkJ5n7nMZsbz1PGwCs1Zs"
          SEED: "invite couch cloud pave stuff cabbage usual rigid dragon warm cable price fame warfare next swallow worth opera suggest flame patch undo position arctic"
          DESTINATION_ADDRESS: uregtest1ur83jamvhc5pwe8xzlu9d8ur4mxmny385mhlurxh5z00e6vhcf9zk0dncar334n0ucskdya9ytdrvzucprqjrhy7hd6rkklp0q6eyxp5

      - name: Restore ZKool GraphQL v6.31.0
        id: zkool-graphql-cache
        uses: actions/cache/restore@v5
        with:
          path: target/release/zkool_graphql
          key: ${{ runner.os }}-zkool-graphql-v6.31.0

      - name: Download ZKool GraphQL v6.31.0
        if: steps.zkool-graphql-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p target/release
          curl --fail --location --retry 5 \
            --output target/release/zkool_graphql \
            https://github.com/hhanh00/zkool2/releases/download/zkool-v6.31.0/zkool_graphql
          chmod +x target/release/zkool_graphql

      - name: Save ZKool GraphQL v6.31.0
        if: steps.zkool-graphql-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: target/release/zkool_graphql
          key: ${{ steps.zkool-graphql-cache.outputs.cache-primary-key }}

      - name: Restore svoted and nf-server
        id: voting-services-cache
        uses: actions/cache/restore@v5
        with:
          path: tools/voting
          key: ${{ runner.os }}-voting-services-${{ env.SVOTED_VERSION }}-${{ env.NF_SERVER_VERSION }}

      - name: Download svoted and nf-server
        if: steps.voting-services-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p tools/voting
          # The Linux amd64 release currently publishes svoted in the
          # cosmovisor archive; the standalone archive is checksum-only.
          svoted_archive="shielded-vote-${SVOTED_VERSION}-cosmovisor-v1-linux-amd64.tar.gz"
          svoted_url="https://github.com/valargroup/vote-sdk/releases/download/${SVOTED_VERSION}/${svoted_archive}"
          curl --fail --location --retry 5 -o "/tmp/${svoted_archive}" "$svoted_url"
          curl --fail --location --retry 5 \
            -o "/tmp/${svoted_archive}.sha256" "${svoted_url}.sha256"
          (cd /tmp && sha256sum -c "${svoted_archive}.sha256")
          tar -xzf "/tmp/${svoted_archive}" -C tools/voting
          test -x tools/voting/bin/svoted
          mv tools/voting/bin/svoted tools/voting/svoted
          rmdir tools/voting/bin

          nf_url="https://github.com/valargroup/vote-nullifier-pir/releases/download/${NF_SERVER_VERSION}/nf-server-linux-amd64"
          curl --fail --location --retry 5 -o tools/voting/nf-server "$nf_url"
          curl --fail --location --retry 5 \
            -o /tmp/nf-server-checksums \
            "https://github.com/valargroup/vote-nullifier-pir/releases/download/${NF_SERVER_VERSION}/SHA256SUMS"
          expected_nf_hash=$(awk '$2 == "nf-server-linux-amd64" { print $1 }' /tmp/nf-server-checksums)
          test -n "$expected_nf_hash"
          printf '%s  %s\n' "$expected_nf_hash" tools/voting/nf-server | sha256sum -c -
          chmod +x tools/voting/nf-server

      - name: Save svoted and nf-server
        if: steps.voting-services-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: tools/voting
          key: ${{ steps.voting-services-cache.outputs.cache-primary-key }}

      - name: Add voting services to PATH
        run: |
          echo "$GITHUB_WORKSPACE/tools/voting" >> "$GITHUB_PATH"
          "$GITHUB_WORKSPACE/tools/voting/svoted" version || \
            "$GITHUB_WORKSPACE/tools/voting/svoted" --version
          "$GITHUB_WORKSPACE/tools/voting/nf-server" --version

      - name: Initialize local svoted chain
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --branch "$SVOTED_VERSION" \
            https://github.com/valargroup/vote-sdk.git tools/vote-sdk
          export PATH="$GITHUB_WORKSPACE/tools/voting:$PATH"
          export SVOTED_HOME="$GITHUB_WORKSPACE/.svoted-ci"
          export CHAIN_ID=svote-ci
          export VM_PRIVKEYS="$(openssl rand -hex 32)"
          export SVOTE_USE_DEFAULT_GENESIS_VOTE_MANAGERS=false
          bash tools/vote-sdk/scripts/init.sh

      - name: Start local svoted chain
        run: |
          set -euo pipefail
          export PATH="$GITHUB_WORKSPACE/tools/voting:$PATH"
          export SVOTED_HOME="$GITHUB_WORKSPACE/.svoted-ci"
          export SVOTE_PIR_URL=disabled
          nohup svoted start --home "$SVOTED_HOME" > svoted.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:1317/status >/dev/null; then
              break
            fi
            if [[ "$attempt" == 60 ]]; then
              tail -200 svoted.log >&2 || true
              exit 1
            fi
            sleep 1
          done

      - name: Import regtest nullifiers into PIR
        env:
          NF_SERVER_BIN: ${{ github.workspace }}/tools/voting/nf-server
          OUTPUT_ENV: ${{ github.workspace }}/pir-server.env
          PIR_DATA_DIR: ${{ github.workspace }}/pir-data/regtest
        run: scripts/configure-pir-server.sh

      - name: Start local nf-server
        run: |
          set -euo pipefail
          set -a
          source pir-server.env
          set +a
          nohup "$GITHUB_WORKSPACE/tools/voting/nf-server" serve \
            --zcash-network regtest \
            --pir-data-dir "$SVOTE_PIR_DATA_DIR" \
            --port "$SVOTE_PIR_PORT" > nf-server.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:${SVOTE_PIR_PORT}/health" >/dev/null; then
              break
            fi
            if [[ "$attempt" == 60 ]]; then
              tail -200 nf-server.log >&2 || true
              exit 1
            fi
            sleep 1
          done

      - name: Scan the real Ironwood note with pinned ZKool
        run: ./example/sh/e2e-ironwood-wallet.sh
        env:
          SEED: "invite couch cloud pave stuff cabbage usual rigid dragon warm cable price fame warfare next swallow worth opera suggest flame patch undo position arctic"
          ZKOOL_GRAPHQL_BIN: ${{ github.workspace }}/target/release/zkool_graphql

      - name: Collect service logs
        if: always()
        run: |
          mkdir -p e2e-artifacts
          for file in zebrad.log lightwalletd.log lwd.log graphql.log e2e-zkool-graphql.log; do
            if [[ -f "$file" ]]; then
              cp "$file" e2e-artifacts/
            fi
          done
          cp misc/zebra.toml e2e-artifacts/zebra.toml

      - name: Upload E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: voting-e2e-logs
          path: e2e-artifacts
          if-no-files-found: warn
          retention-days: 7
