name: Voting E2E Infrastructure

on:
  workflow_dispatch:

concurrency:
  group: voting-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zkool-graphql:
    uses: ./.github/workflows/zkool-graphql-build.yml

  ironwood-wallet:
    needs: zkool-graphql
    name: Zebra → lightwalletd → ZKool V3 note
    if: ${{ !startsWith(github.head_ref, 'release-please--branches--') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SVOTED_VERSION: v1.6.1-rc.6
      NF_SERVER_REPOSITORY: hhanh00/vote-nullifier-pir
      NF_SERVER_COMMIT: 8ce99cc667282c584c05df745a2b7b446e8665ec
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Start fresh regtest and fund an Ironwood note
        uses: ./.github/actions/zebra
        with:
          MINER_SEED: "burger voice warrior danger satoshi you solid atom elite alcohol category layer able debate culture talk tissue language hip surge fiction paddle stove voyage"
          MINER_ADDRESS: "tmQ1BiNRfsvT6eMkJ5n7nMZsbz1PGwCs1Zs"
          SEED: "invite couch cloud pave stuff cabbage usual rigid dragon warm cable price fame warfare next swallow worth opera suggest flame patch undo position arctic"
          DESTINATION_ADDRESS: uregtest1ur83jamvhc5pwe8xzlu9d8ur4mxmny385mhlurxh5z00e6vhcf9zk0dncar334n0ucskdya9ytdrvzucprqjrhy7hd6rkklp0q6eyxp5
          BLOCKS: "350"

      - name: Restore checked-out ZKool GraphQL
        uses: actions/cache/restore@v5
        with:
          path: target/release/zkool_graphql
          key: ${{ runner.os }}-zkool-graphql-${{ hashFiles('Cargo.lock', 'rust/Cargo.toml', 'rust/src/**') }}

      - name: Restore svoted and nf-server
        id: voting-services-cache
        uses: actions/cache/restore@v5
        with:
          path: tools/voting
          key: ${{ runner.os }}-voting-services-${{ env.SVOTED_VERSION }}-${{ env.NF_SERVER_REPOSITORY }}-${{ env.NF_SERVER_COMMIT }}-serve-grpcurl-v4

      - name: Download svoted and build nf-server
        if: steps.voting-services-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p tools/voting
          # The Linux amd64 release currently publishes svoted in the
          # cosmovisor archive; the standalone archive is checksum-only.
          svoted_archive="shielded-vote-${SVOTED_VERSION}-cosmovisor-v1-linux-amd64.tar.gz"
          svoted_url="https://github.com/valargroup/vote-sdk/releases/download/${SVOTED_VERSION}/${svoted_archive}"
          curl --fail --location --retry 5 -o "/tmp/${svoted_archive}" "$svoted_url"
          curl --fail --location --retry 5 \
            -o "/tmp/${svoted_archive}.sha256" "${svoted_url}.sha256"
          (cd /tmp && sha256sum -c "${svoted_archive}.sha256")
          tar -xzf "/tmp/${svoted_archive}" -C tools/voting
          test -x tools/voting/bin/svoted
          mv tools/voting/bin/svoted tools/voting/svoted
          rmdir tools/voting/bin

          git clone --no-checkout --filter=blob:none \
            "https://github.com/$NF_SERVER_REPOSITORY.git" /tmp/vote-nullifier-pir
          git -C /tmp/vote-nullifier-pir fetch --depth 1 origin "$NF_SERVER_COMMIT"
          git -C /tmp/vote-nullifier-pir checkout --detach "$NF_SERVER_COMMIT"
          cargo build --locked --release --manifest-path /tmp/vote-nullifier-pir/Cargo.toml -p nf-server --features serve
          cp /tmp/vote-nullifier-pir/target/release/nf-server tools/voting/nf-server
          GOBIN="$GITHUB_WORKSPACE/tools/voting" \
            go install github.com/fullstorydev/grpcurl/cmd/grpcurl@v1.9.3

      - name: Save svoted and nf-server
        if: steps.voting-services-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: tools/voting
          key: ${{ steps.voting-services-cache.outputs.cache-primary-key }}

      - name: Add voting services to PATH
        run: |
          echo "$GITHUB_WORKSPACE/tools/voting" >> "$GITHUB_PATH"
          "$GITHUB_WORKSPACE/tools/voting/svoted" version || \
            "$GITHUB_WORKSPACE/tools/voting/svoted" --version
          "$GITHUB_WORKSPACE/tools/voting/nf-server" --version
          "$GITHUB_WORKSPACE/tools/voting/grpcurl" -version

      - name: Initialize local svoted chain
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --branch "$SVOTED_VERSION" \
            https://github.com/valargroup/vote-sdk.git tools/vote-sdk
          export PATH="$GITHUB_WORKSPACE/tools/voting:$PATH"
          export SVOTED_HOME="$GITHUB_WORKSPACE/.svoted-ci"
          export CHAIN_ID=svote-ci
          export VM_PRIVKEYS="$(openssl rand -hex 32)"
          export SVOTE_USE_DEFAULT_GENESIS_VOTE_MANAGERS=false
          bash tools/vote-sdk/scripts/init.sh
          go build -C tools/vote-sdk -o "$GITHUB_WORKSPACE/tools/voting/voting-config" ./cmd/voting-config

      - name: Start local svoted chain
        run: |
          set -euo pipefail
          export PATH="$GITHUB_WORKSPACE/tools/voting:$PATH"
          export SVOTED_HOME="$GITHUB_WORKSPACE/.svoted-ci"
          export SVOTE_PIR_URL=disabled
          nohup svoted start --home "$SVOTED_HOME" > svoted.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:1317/cosmos/base/tendermint/v1beta1/node_info >/dev/null; then
              break
            fi
            if [[ "$attempt" == 60 ]]; then
              tail -200 svoted.log >&2 || true
              exit 1
            fi
            sleep 1
          done

      - name: Import regtest nullifiers into PIR
        env:
          NF_SERVER_BIN: ${{ github.workspace }}/tools/voting/nf-server
          OUTPUT_ENV: ${{ github.workspace }}/pir-server.env
          PIR_DATA_DIR: ${{ github.workspace }}/pir-data/regtest
        run: scripts/configure-pir-server.sh

      - name: Start local nf-server
        run: |
          set -euo pipefail
          set -a
          source pir-server.env
          set +a
          nohup "$GITHUB_WORKSPACE/tools/voting/nf-server" serve \
            --zcash-network regtest \
            --pir-data-dir "$SVOTE_PIR_DATA_DIR" \
            --port "$SVOTE_PIR_PORT" > nf-server.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:${SVOTE_PIR_PORT}/root" | jq -e '.circuit_root' >/dev/null; then
              break
            fi
            if [[ "$attempt" == 60 ]]; then
              tail -200 nf-server.log >&2 || true
              exit 1
            fi
            sleep 1
          done

      - name: Create real voting rounds
        run: scripts/create-e2e-voting-rounds.sh
        env:
          SVOTED_BIN: ${{ github.workspace }}/tools/voting/svoted
          SVOTED_HOME: ${{ github.workspace }}/.svoted-ci
          CHAIN_ID: svote-ci
          SVOTED_GRPC: 127.0.0.1:9190
          VOTE_SDK_PROTO_ROOT: ${{ github.workspace }}/tools/vote-sdk/proto

      - name: Sign and serve local voting configuration
        run: |
          set -euo pipefail
          config_dir="$GITHUB_WORKSPACE/e2e-voting-config"
          cert_dir="$GITHUB_WORKSPACE/e2e-voting-tls"
          mkdir -p "$cert_dir"
          openssl req -x509 -new -nodes -sha256 -days 1 \
            -subj '/CN=ZKool E2E Config CA' \
            -keyout "$cert_dir/ca.key" -out "$cert_dir/ca.crt"
          openssl req -new -nodes -sha256 \
            -subj '/CN=localhost' \
            -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1' \
            -keyout "$cert_dir/server.key" -out "$cert_dir/server.csr"
          openssl x509 -req -sha256 -days 1 \
            -in "$cert_dir/server.csr" -CA "$cert_dir/ca.crt" -CAkey "$cert_dir/ca.key" \
            -CAcreateserial -out "$cert_dir/server.crt" \
            -extfile <(printf 'subjectAltName=DNS:localhost,IP:127.0.0.1')
          sudo cp "$cert_dir/ca.crt" /usr/local/share/ca-certificates/zkool-e2e-config-ca.crt
          sudo update-ca-certificates
          set -a
          source pir-server.env
          set +a
          CONFIG_DIR="$config_dir" \
          VOTING_CONFIG_BIN="$GITHUB_WORKSPACE/tools/voting/voting-config" \
          GRPCURL_BIN="$GITHUB_WORKSPACE/tools/voting/grpcurl" \
          VOTE_SDK_PROTO_ROOT="$GITHUB_WORKSPACE/tools/vote-sdk/proto" \
          bash "$GITHUB_WORKSPACE/scripts/configure-e2e-voting-config.sh"
          nohup python3 "$GITHUB_WORKSPACE/scripts/serve-e2e-voting-config.py" \
            --directory "$config_dir" --cert "$cert_dir/server.crt" --key "$cert_dir/server.key" \
            --grpcurl "$GITHUB_WORKSPACE/tools/voting/grpcurl" \
            --proto-root "$GITHUB_WORKSPACE/tools/vote-sdk/proto" \
            > voting-config.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --cacert "$cert_dir/ca.crt" \
              https://localhost:8443/static-voting-config.json >/dev/null; then
              break
            fi
            if [[ "$attempt" == 30 ]]; then
              cat voting-config.log >&2 || true
              exit 1
            fi
            sleep 1
          done
          source "$config_dir/config.env"
          echo "VOTING_CONFIG_URL=$VOTING_CONFIG_URL" >> "$GITHUB_ENV"
          echo "ZKOOL_EXTRA_ROOT_CERT_PATH=$cert_dir/ca.crt" >> "$GITHUB_ENV"

      - name: Scan the real Ironwood note and resolve voting configuration
        run: ./example/sh/e2e-ironwood-wallet.sh
        env:
          SEED: "invite couch cloud pave stuff cabbage usual rigid dragon warm cable price fame warfare next swallow worth opera suggest flame patch undo position arctic"
          ZKOOL_GRAPHQL_BIN: ${{ github.workspace }}/target/release/zkool_graphql

      - name: Wait for and verify the real voting tally
        run: scripts/wait-e2e-voting-tally.sh
        env:
          SVOTED_GRPC: 127.0.0.1:9190
          GRPCURL_BIN: ${{ github.workspace }}/tools/voting/grpcurl
          VOTE_SDK_PROTO_ROOT: ${{ github.workspace }}/tools/vote-sdk/proto

      - name: Collect service logs
        if: always()
        run: |
          mkdir -p e2e-artifacts
          for file in zebrad.log lightwalletd.log lwd.log graphql.log e2e-zkool-graphql.log svoted.log nf-server.log voting-config.log; do
            if [[ -f "$file" ]]; then
              cp "$file" e2e-artifacts/
            fi
          done
          cp misc/zebra.toml e2e-artifacts/zebra.toml

      - name: Upload E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: voting-e2e-logs
          path: e2e-artifacts
          if-no-files-found: warn
          retention-days: 7
