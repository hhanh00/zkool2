name: Linux build image

# Publishes the image Linux releases build in. Releases pin it by digest in
# misc/build-linux-in-container.sh, so a new image is only used once that changes.
# Run this by hand to pick up security updates, then update the digest.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - misc/linux-build.dockerfile
      - .github/workflows/linux-build-image.yml

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/zkool-linux-build

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          # The Dockerfile copies nothing, so any small directory will do.
          context: .github/actions/linux
          file: misc/linux-build.dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:22.04
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Print the digest to pin
        run: echo "${IMAGE}@${{ steps.build.outputs.digest }}" | tee -a "$GITHUB_STEP_SUMMARY"
