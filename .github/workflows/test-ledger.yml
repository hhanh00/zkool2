name: Test Ledger

on:
  workflow_dispatch:

jobs:
  emulator:
    runs-on: ubuntu-latest
    steps:
      - name: Install RUST
        uses: dtolnay/rust-toolchain@stable
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config protobuf-compiler
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Setup emulator
        run: |
          misc/ledger/setup.sh
          misc/ledger/build.sh
          misc/ledger/run-emulator.sh
      - name: Verify emulator
        run: |
          response=$(curl -s -m 5 -X POST http://127.0.0.1:9999 \
            -H 'Content-Type: application/json' -d '{"apduHex": "e0c4000000"}')
          echo "$response"
          echo "$response" | grep -qE '"data": "3830[0-9a-f]*9000", "error": null'
      - name: Run ledger tests
        run: |
          cd rust
          cargo test --features zemu -- --ignored --nocapture ledger_app_version
