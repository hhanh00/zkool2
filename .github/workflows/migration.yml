name: Migration Tests

on:
  workflow_dispatch:
  pull_request:

jobs:
  regtest-tools:
    uses: ./.github/workflows/regtest-tools-build.yml

  zkool-graphql:
    uses: ./.github/workflows/zkool-graphql-build.yml

  migration:
    needs: [zkool-graphql, regtest-tools]
    runs-on: ubuntu-latest
    steps:
      - name: Install RUST
        uses: dtolnay/rust-toolchain@stable
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Restore pinned regtest tools
        uses: ./.github/actions/install-regtest-tools

      - name: Restore zkool_graphql
        uses: actions/cache/restore@v5
        with:
          path: target/release/zkool_graphql
          key: ${{ runner.os }}-zkool-graphql-${{ hashFiles('Cargo.lock', 'rust/Cargo.toml', 'rust/src/**', 'lib/**/*.dart', 'pubspec.yaml', 'pubspec.lock') }}

      # target/release first, so the chain is brought up with the binary built
      # from this PR rather than the released one cached in tools/bin.
      - name: Add tools to PATH
        run: |
          echo "$GITHUB_WORKSPACE/target/release" >> $GITHUB_PATH

      # Stops below the Ironwood (NU6.3) activation height of 250 and funds
      # nothing: the test needs to create legacy Orchard notes, which is only
      # possible before activation, and it funds its own accounts.
      - name: Start regtest below Ironwood activation
        run: |
          rm -rf "$HOME/.cache/zebra" data regtest.db
          ./example/sh/mine.sh
        env:
          BLOCKS: 150
          FUND: 0
          MINER_ADDRESS: "tmQ1BiNRfsvT6eMkJ5n7nMZsbz1PGwCs1Zs"

      - name: Run migration test
        run: |
          cd tests
          pip install uv
          uv sync --all-groups
          uv run pytest tests/test_migration.py -v -s

      - name: Dump logs on failure
        if: failure()
        run: |
          tail -100 zebrad.log || true
          tail -100 lightwalletd.log || true
          tail -200 /tmp/graphql_migration.log || true
