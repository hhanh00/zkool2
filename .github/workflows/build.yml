name: Build and Release

on:
  workflow_dispatch:
  pull_request:
    branches:
    - main
  push:
    tags:
      - zkool-v*

jobs:
  build:
    # Release-please PRs skip every step rather than the whole job: a job
    # skipped by its own `if` reports one check named "build", so the matrix
    # check the ruleset requires never appears and the PR stays blocked.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: android
          # Pinned: the runner's glibc sets the minimum for the AppImage and
          # the .deb, so a moving label raises it without any change here.
          - os: ubuntu-24.04
            target: linux
            arch: x86_64
          - os: ubuntu-24.04-arm
            target: linux
            arch: aarch64
          - os: macos-latest
            target: mac
          - os: windows-latest
            target: windows
    env:
      FLUTTER_VERSION: 3.47.4
      NEAR_INTENTS_API_KEY: ${{ secrets.NEAR_INTENTS_API_KEY }}
      RELEASE_PR: ${{ startsWith(github.head_ref, 'release-please--branches--') }}
    permissions:
      id-token: write
      attestations: write
      contents: write

    steps:
      - name: Install RUST
        if: ${{ env.RELEASE_PR != 'true' }}
        uses: dtolnay/rust-toolchain@stable
      - name: Install PYTHON
        if: ${{ env.RELEASE_PR != 'true' }}
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Checkout code
        if: ${{ env.RELEASE_PR != 'true' }}
        uses: actions/checkout@v6
      - name: Set up Flutter
        if: ${{ env.RELEASE_PR != 'true' }}
        shell: bash
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git $RUNNER_TEMP/flutter
          echo "$RUNNER_TEMP/flutter/bin" >> $GITHUB_PATH
      - if: ${{ env.RELEASE_PR != 'true' }}
        run: |
          flutter --version
          flutter precache
        shell: bash
      - name: Get version number
        if: ${{ env.RELEASE_PR != 'true' }}
        id: version
        shell: bash
        run: |
          SEMVER=$(sed -n 's/^version: *\([^ ]*\).*/\1/p' pubspec.yaml)
          BUILD=$(cat build_number.txt)
          RELEASE_VERSION="${SEMVER}+${BUILD}"
          sed -i.bak "s/^version: .*/version: ${RELEASE_VERSION}/" pubspec.yaml && rm -f pubspec.yaml.bak
          echo "result=$RELEASE_VERSION" >> $GITHUB_OUTPUT
      - name: Build Android
        id: build_android
        if: ${{ env.RELEASE_PR != 'true' && (matrix.target == 'android' && github.event_name != 'pull_request') }}
        uses: ./.github/actions/android
        with:
          version: ${{ steps.version.outputs.result }}
          jks: ${{ secrets.JKS_PASSWORD }}
      - name: Build Linux
        id: build_linux
        # The aarch64 build is the required PR check; x86_64 only needs to be
        # built for releases.
        if: ${{ env.RELEASE_PR != 'true' && (matrix.target == 'linux' && (matrix.arch != 'x86_64' || github.event_name != 'pull_request')) }}
        uses: ./.github/actions/linux
        with:
          version: ${{ steps.version.outputs.result }}
          os: ${{ matrix.os }}
          arch: ${{ matrix.arch }}
      - name: Build Mac
        id: build_mac
        if: ${{ env.RELEASE_PR != 'true' && (matrix.target == 'mac' && github.event_name != 'pull_request') }}
        uses: ./.github/actions/mac
        with:
          version: ${{ steps.version.outputs.result }}
          jks: ${{ secrets.JKS_PASSWORD }}
          ios_pwd: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          mac_pwd: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          apple_cert_name: ${{ secrets.MACOS_CERTIFICATE_NAME }}
          apple_id: ${{ secrets.MACOS_NOTARIZATION_APPLE_ID }}
          apple_pwd: ${{ secrets.MACOS_NOTARIZATION_PWD }}
          apple_team_id: ${{ secrets.MACOS_NOTARIZATION_TEAM_ID }}
      - name: Build Windows
        id: build_windows
        if: ${{ env.RELEASE_PR != 'true' && (matrix.target == 'windows' && github.event_name != 'pull_request') }}
        uses: ./.github/actions/windows
        with:
          version: ${{ steps.version.outputs.result }}
      - name: Collect output dir
        if: ${{ env.RELEASE_PR != 'true' }}
        id: collect
        shell: bash
        run: |
          df -h
          echo "outdir=${{ steps.build_android.outputs.outdir || steps.build_linux.outputs.outdir || steps.build_mac.outputs.outdir || steps.build_windows.outputs.outdir }}" >> $GITHUB_OUTPUT
      - name: Attest build provenance
        if: startsWith(github.ref_name, 'zkool-v')
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.collect.outputs.outdir }}/*
      - name: Create Release
        if: startsWith(github.ref_name, 'zkool-v')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.collect.outputs.outdir }}/*
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
